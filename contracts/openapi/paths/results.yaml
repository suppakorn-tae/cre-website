# Results of the last submission and the strategy per H/VH indicator.
# Results are read as stored; nothing is recalculated.
/projects/{project_id}/versions/{version_id}/results:
  parameters:
    - name: project_id
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/schemas/Uuid
    - name: version_id
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/schemas/Uuid
  get:
    operationId: getResults
    summary: Get the results of the last submission.
    description: 404 when the version was never submitted, deleted or not owned.
    responses:
      '200':
        description: Per-indicator results, advice and strategies, with counts per level.
        content:
          application/json:
            schema:
              $ref: ../schemas/assessments.yaml#/ResultsResponse
            examples:
              advice-lengths:
                summary: Advice lists of 1, 3 and 5 items
                value:
                  version_id: 0191a0de-0000-7000-8000-000000000001
                  submitted_at: '2026-11-24T10:00:00Z'
                  editable: true
                  summary:
                    scored_count: 3
                    level_counts: {VL: 0, L: 1, M: 0, H: 1, VH: 1}
                    average_rm: 3.412
                  factor_averages:
                    - {factor_code: EC-MG, scored_count: 1, average_rm: 2}
                    - {factor_code: EC-HS, scored_count: 2, average_rm: 4.232}
                  items:
                    - indicator_code: EC-MG-1
                      x: 2
                      y1_pct: 1.5
                      y2_pct: 3
                      rl: 2
                      ri_c: 2
                      ri_t: 2
                      ri_e: 2
                      ri_max: 2
                      rm: 2
                      level: L
                    - indicator_code: EC-HS-2
                      x: 5
                      y1_pct: 12
                      y2_pct: 10
                      rl: 3
                      ri_c: 4
                      ri_t: 4
                      ri_e: 3
                      ri_max: 4
                      rm: 3.464
                      level: H
                      advice:
                        - list: RI_C
                          items: [first item]
                        - list: RI_T
                          items: [first item, second item, third item]
                      strategy: REDUCE
                      strategy_updated_at: '2026-11-24T10:05:00Z'
                    - indicator_code: EC-HS-5
                      x: 9
                      y1_pct: 40
                      y2_pct: 35
                      rl: 5
                      ri_c: 5
                      ri_t: 5
                      ri_e: 5
                      ri_max: 5
                      rm: 5
                      level: VH
                      advice:
                        - list: RL
                          items: [item 1, item 2, item 3, item 4, item 5]
      '401':
        $ref: ../schemas/common.yaml#/responses/Unauthorized
      '404':
        $ref: ../schemas/common.yaml#/responses/NotFound
/projects/{project_id}/versions/{version_id}/results/{indicator_code}/strategy:
  parameters:
    - name: project_id
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/schemas/Uuid
    - name: version_id
      in: path
      required: true
      schema:
        $ref: ../schemas/common.yaml#/schemas/Uuid
    - name: indicator_code
      in: path
      required: true
      schema:
        $ref: ../schemas/assessments.yaml#/IndicatorCode
  put:
    operationId: putStrategy
    summary: Set or change the strategy of an H or VH indicator.
    description: |
      409 when the version is not the latest. 422 with code `not_high_risk`
      when the indicator is not H or VH.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/assessments.yaml#/StrategyRequest
    responses:
      '200':
        description: The saved strategy.
        content:
          application/json:
            schema:
              $ref: ../schemas/assessments.yaml#/StrategyChoice
      '400':
        $ref: ../schemas/common.yaml#/responses/BadRequest
      '401':
        $ref: ../schemas/common.yaml#/responses/Unauthorized
      '403':
        $ref: ../schemas/common.yaml#/responses/Forbidden
      '404':
        $ref: ../schemas/common.yaml#/responses/NotFound
      '409':
        $ref: ../schemas/common.yaml#/responses/Conflict
      '422':
        $ref: ../schemas/common.yaml#/responses/ValidationFailed
