# Mounted into the db container. archive-push is sent over TLS to the
# backup container, which holds the S3 credentials. db stays on
# private-net only and never talks to the internet.
[global]
repo1-host=backup
repo1-host-type=tls
repo1-host-port=8432
repo1-host-ca-file=/etc/pgbackrest/tls/ca.crt
repo1-host-cert-file=/etc/pgbackrest/tls/client.crt
repo1-host-key-file=/etc/pgbackrest/tls/client.key
repo2-host=backup
repo2-host-type=tls
repo2-host-port=8432
repo2-host-ca-file=/etc/pgbackrest/tls/ca.crt
repo2-host-cert-file=/etc/pgbackrest/tls/client.crt
repo2-host-key-file=/etc/pgbackrest/tls/client.key
log-level-console=warn

[cre]
pg1-path=/var/lib/postgresql/data
