# Production overrides (IO-80). Layer on compose.yaml (and compose.backup.yaml
# when BACKUP_ENABLED=true):
#   docker compose -f compose.yaml -f compose.backup.yaml -f compose.prod.yaml ...
# See docs/runbooks/deploy.md. Images are built and pushed by
# .github/workflows/release.yml, tagged by git SHA and, for releases, by
# version. IMAGE_TAG picks a version (v1.4.0) or a full SHA; deploy.sh
# refuses "latest" and branch names, resolves the tag to each image's
# digest on `pull` and passes IMAGE_DIGEST_* here, so a moved tag never
# changes what runs (IO-245). Run it through deploy/backup/deploy.sh.

x-limits-small: &limits-small
  limits: { cpus: "0.50", memory: 256M }
x-limits-medium: &limits-medium
  limits: { cpus: "1.00", memory: 512M }
x-limits-large: &limits-large
  limits: { cpus: "2.00", memory: 1G }

services:
  caddy:
    restart: always
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-conriskexpert.com}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL for Lets Encrypt notices}
    deploy:
      resources:
        <<: *limits-small

  web:
    image: ${IMAGE_REGISTRY:?}/cre-web@${IMAGE_DIGEST_WEB:?run deploy/backup/deploy.sh pull to pin IMAGE_TAG}
    build: !reset null
    restart: always
    deploy:
      resources:
        <<: *limits-medium

  api:
    image: ${IMAGE_REGISTRY:?}/cre-api@${IMAGE_DIGEST_API:?run deploy/backup/deploy.sh pull to pin IMAGE_TAG}
    build: !reset null
    restart: always
    environment:
      APP_ENV: production
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?}
      SESSION_SECRET: ${SESSION_SECRET:?required in production}
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?Brevo SMTP login}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Brevo SMTP key}
      SMTP_FROM: ${SMTP_FROM:-no-reply@conriskexpert.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}
      RL_REPORT_REQUEST_LIMIT: ${RL_REPORT_REQUEST_LIMIT:-10}
      RL_REPORT_REQUEST_WINDOW: ${RL_REPORT_REQUEST_WINDOW:-10m}
      RL_GOOGLE_IP_LIMIT: ${RL_GOOGLE_IP_LIMIT:-30}
      RL_GOOGLE_IP_WINDOW: ${RL_GOOGLE_IP_WINDOW:-15m}
    deploy:
      resources:
        <<: *limits-medium

  worker:
    image: ${IMAGE_REGISTRY:?}/cre-worker@${IMAGE_DIGEST_WORKER:?run deploy/backup/deploy.sh pull to pin IMAGE_TAG}
    build: !reset null
    restart: always
    deploy:
      resources:
        <<: *limits-large

  migrate:
    image: ${IMAGE_REGISTRY:?}/cre-migrate@${IMAGE_DIGEST_MIGRATE:?run deploy/backup/deploy.sh pull to pin IMAGE_TAG}
    build: !reset null
    restart: "no"
    deploy:
      resources:
        <<: *limits-small

  db:
    restart: always
    deploy:
      resources:
        <<: *limits-large

  valkey:
    restart: always
    deploy:
      resources:
        <<: *limits-small

  rustfs:
    restart: always
    deploy:
      resources:
        <<: *limits-medium

  gotenberg:
    restart: always
    deploy:
      resources:
        <<: *limits-large

  # No Mailpit in production: it sits in the dev profile and is never
  # started. Do not put "dev" in COMPOSE_PROFILES.
