name: cre

x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL}
  DB_REQUIRE_APP_ROLE: ${DB_REQUIRE_APP_ROLE:-false}
  VALKEY_ADDR: ${VALKEY_ADDR}
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_REGION: ${S3_REGION}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  GOTENBERG_URL: ${GOTENBERG_URL}
  SESSION_TTL: ${SESSION_TTL}
  REMEMBER_TTL: ${REMEMBER_TTL}
  SCORE_DECIMALS: ${SCORE_DECIMALS}
  RM_DECIMALS: ${RM_DECIMALS}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
  MAX_PROJECTS_PER_USER: ${MAX_PROJECTS_PER_USER:-3}
  MAX_VERSIONS_PER_PROJECT: ${MAX_VERSIONS_PER_PROJECT:-10}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks: [public-net, private-net]
    depends_on: [web, api]

  web:
    build:
      context: ../..
      dockerfile: web/Dockerfile
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000/api/v1
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    networks: [private-net]

  api:
    build:
      context: ../../backend
      target: api
    restart: unless-stopped
    environment:
      <<: *app-env
      APP_ENV: ${APP_ENV:-production}
      SESSION_SECRET: ${SESSION_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-${PUBLIC_BASE_URL}}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      # Empty: the api requires STARTTLS when APP_ENV is production.
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-}
    networks: [private-net, egress-net]
    depends_on:
      migrate: { condition: service_completed_successfully }
      db: { condition: service_healthy }
      valkey: { condition: service_healthy }
      rustfs: { condition: service_healthy }

  worker:
    build:
      context: ../../backend
      target: worker
    restart: unless-stopped
    environment:
      <<: *app-env
      WORKER_REPORTS_CONCURRENCY: ${WORKER_REPORTS_CONCURRENCY:-}
      WORKER_EXPORTS_CONCURRENCY: ${WORKER_EXPORTS_CONCURRENCY:-}
      EXPORT_TIMEOUT: ${EXPORT_TIMEOUT:-25m}
      REPORT_TIMEOUT: ${REPORT_TIMEOUT:-5m}
      JOB_STUCK_MARGIN: ${JOB_STUCK_MARGIN:-10m}
      JOB_QUEUED_MAX_AGE: ${JOB_QUEUED_MAX_AGE:-6h}
    networks: [private-net]
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      rustfs: { condition: service_healthy }
      gotenberg: { condition: service_healthy }

  migrate:
    build:
      context: ../../backend
      target: migrate
    restart: "no"
    environment:
      DATABASE_URL: ${MIGRATE_DATABASE_URL}
      # migrate sets the password of the application role cre_app (the role
      # the api and worker connect as) to this value.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD, the password of the cre_app database role}
    networks: [private-net]
    depends_on:
      db: { condition: service_healthy }

  db:
    image: postgres:19.0-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # From 18 on the image keeps PGDATA in /var/lib/postgresql/19/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [private-net]

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [private-net]

  rustfs:
    image: rustfs/rustfs:1.0.6
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [private-net]

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [private-net]

  mailpit:
    profiles: [dev]
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [private-net]

networks:
  public-net: {}
  private-net:
    internal: true
  egress-net: {}

volumes:
  pgdata:
  valkey-data:
  rustfs-data:
  caddy-data:
