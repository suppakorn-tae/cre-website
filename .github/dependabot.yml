# Security updates only (IO-156). No routine version updates: a
# dependency that works stays as it is. open-pull-requests-limit: 0
# switches version updates off for the ecosystem; security updates have
# their own fixed cap (10) and still open PRs. Do not add `ignore`
# rules: they also suppress security fixes, and a fix may need a major.
# Each ecosystem has one security group, so it gets one PR. Commit
# prefixes use an allowed type and scope so commitlint passes; group
# names are short to keep the title within 72 characters.
# Docker is left out because Dependabot security updates do not support
# it. Alerts and security updates are enabled in the repo settings.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(api)"
    groups:
      go:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(web)"
    groups:
      npm:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci(ci)"
    groups:
      actions:
        applies-to: security-updates
        patterns: ["*"]
