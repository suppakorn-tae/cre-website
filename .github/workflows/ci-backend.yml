name: ci-backend

on:
  pull_request:
    paths: &paths
      - "backend/**"
      - "contracts/**"
      - "Makefile"
      - ".github/workflows/ci-backend.yml"
  push:
    branches: [main]
    paths: *paths

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cre
          POSTGRES_PASSWORD: cre
          POSTGRES_DB: cre
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cre"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://cre:cre@localhost:5432/cre?sslmode=disable
      VALKEY_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: gofumpt
        working-directory: backend
        run: |
          go install mvdan.cc/gofumpt@latest
          unformatted="$("$(go env GOPATH)/bin/gofumpt" -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofumpt: these files need formatting:"
            echo "$unformatted"
            exit 1
          fi
      - uses: golangci/golangci-lint-action@v8
        with:
          working-directory: backend
      - name: go test
        working-directory: backend
        run: go test ./...

  codegen:
    name: codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - run: pnpm install --frozen-lockfile
      - name: make gen
        run: make gen
      - name: Fail when generated code is stale
        run: git diff --exit-code
