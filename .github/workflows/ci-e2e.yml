name: ci-e2e

# Nightly, on demand, and on every pull request. The `changes` job decides what a
# pull request needs, so both jobs always report: a skipped job shows as skipped,
# which a required check counts as success. e2e-mock holds the axe gate (WCAG 2.2
# AA): a web change that adds a violation fails it. ci-ok lives in another workflow
# and cannot wait for this one, so Tae adds the check name `e2e-mock` to the
# required checks of main.
on:
  pull_request:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

concurrency:
  group: ci-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which jobs a pull request needs. Path filtering is done per job (as in ci.yml),
  # never with workflow-level `paths:`, so the checks always report.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      mock: ${{ steps.filter.outputs.mock }}
      stack: ${{ steps.filter.outputs.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            mock:
              - "web/**"
              - "e2e/**"
              - "contracts/**"
              - ".github/workflows/ci-e2e.yml"
            stack:
              - "e2e/**"
              - "deploy/compose/compose.test.yaml"
              - ".github/workflows/ci-e2e.yml"

  # New CVEs show up in code nobody touched. Runs on the nightly schedule and on
  # manual dispatch only; pull requests get the same scan from ci.yml.
  govulncheck:
    name: govulncheck
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: govulncheck
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  # The web app alone in mock mode: no compose stack and no api.
  e2e-mock:
    name: e2e-mock
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.mock == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: e2e typecheck
        run: pnpm --dir e2e typecheck
      - name: Install Playwright browsers
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium
      # Runs the mock smoke specs and the axe gate (e2e/tests/a11y): every page at
      # 375 and 1280 px against WCAG 2.2 AA. A new violation fails this job.
      - name: Playwright in mock mode
        working-directory: e2e
        env:
          CI: "true"
        run: pnpm run test:mock
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mock
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: e2e
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium
      - name: Start the compose stack
        working-directory: e2e
        run: pnpm run stack:up
      - name: Playwright
        working-directory: e2e
        env:
          CI: "true"
        run: pnpm test
      - name: Compose logs
        if: failure()
        working-directory: e2e
        run: |
          docker compose --env-file compose.env \
            -f ../deploy/compose/compose.yaml -f ../deploy/compose/compose.test.yaml \
            --profile test logs --no-color --tail 200
      - name: Upload report, traces and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop the stack
        if: always()
        working-directory: e2e
        run: pnpm run stack:down
